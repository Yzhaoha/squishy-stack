<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>捏捏叠叠乐 · 满仓挤合</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#5a2640}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));background:radial-gradient(ellipse at top,#fff5f8,#f8dfee 70%,#ead9f2)}
.machine{width:min(94vw,604px);padding:clamp(8px,1.9vw,16px);border:2px solid #fff9fb;border-radius:26px;background:linear-gradient(#ffb7d4,#f6d3e7 44%,#eca3c7);box-shadow:0 9px 0 #d185ac,0 18px 42px #7c385944;display:grid;gap:8px}
header{text-align:center}h1{margin:0;font-size:clamp(19px,5vw,29px);font-weight:900}header p{margin:3px 0 0;font-size:clamp(12px,3vw,15px)}
.progress{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:750;padding:0 5px}
.window{display:block;width:100%;border:3px solid #fff7fb;border-radius:18px;overflow:hidden;background:#ffedf6;box-shadow:0 2px 0 #cf82ac}
canvas{display:block;width:100%;aspect-ratio:400/267;max-height:56dvh;touch-action:pan-y}
.controls{display:flex;gap:8px}
button{font:inherit;min-height:48px;cursor:pointer;border-radius:16px;border:2px solid #fff8fc;font-weight:800;color:#57213d;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#squeeze{flex:1;background:#fa84b1;box-shadow:0 4px 0 #c95787}#squeeze:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #c95787}
#squeeze:disabled{cursor:default;background:#f7b9d2;box-shadow:0 4px 0 #ce8dac}#reset{background:#fff1f8;padding:0 14px}
button:focus-visible{outline:3px solid #79426b;outline-offset:3px}
#hint{text-align:center;font-size:13px;min-height:2em;margin:3px 0 0}
@media (orientation:landscape) and (max-height:520px){
 .machine{width:min(94vw,calc((100dvh - 135px)*1.5 + 150px),720px);grid-template-columns:minmax(0,1fr) 126px;gap:4px 10px;padding:7px}
 header,.progress,#hint{grid-column:1/-1}
 .controls{flex-direction:column;align-self:center}.controls button{flex:auto}
 h1{font-size:19px}header p{font-size:11px}.progress,#hint{font-size:11px}
 canvas{max-height:calc(100dvh - 128px)}button{min-height:44px}
}
@media (prefers-reduced-motion:reduce){button:active{transform:none!important}}
</style>
</head>
<body>
<main class="machine" aria-label="捏捏叠叠乐：满仓挤合">
<header><h1>捏捏合成机</h1><p>开局已满仓，只按「捏一下」。同款碰撞会合成。</p></header>
<div class="progress"><span id="remaining"></span><span id="presses"></span></div>
<div class="window"><canvas id="view" aria-label="待合成玩具，不需要点击玩具"></canvas></div>
<div class="controls"><button id="squeeze" type="button">捏一下</button><button id="reset" type="button">重开</button></div>
<p id="hint" role="status"></p>
</main>
<script>/*MATTER*/</script>
<script>
/*CHARS*/
const {Engine,Bodies,Body,Composite,Events,Vertices}=Matter;
const W=400,H=267;
const IDS=['mochi','bun','frog','berry','shiba','jelly','peng'];
const NAMES=['麻薯','包子','青蛙','草莓','柴犬','果冻','企鹅'];
const SIZE=[46,58,74,92,114,138,162].map(s=>s*1.10);
const IMG=IDS.map(id=>{const im=new Image();im.src=CHARS[id].u;return im});
// 8×1 + 8×2 + 10×4 = 64, exactly one penguin if the pile fully combines.
const PACK=[
  [0,1,2,0,1,2],
  [2,0,1,2,0],
  [1,2,0,2,1],
  [0,1,2,1,2],
  [2,0,1,2,0],
];
const BTN=document.getElementById('squeeze'),RESET=document.getElementById('reset'),
  REM=document.getElementById('remaining'),PRES=document.getElementById('presses'),HINT=document.getElementById('hint');
const CV=document.getElementById('view'),CTX=CV.getContext('2d');
const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
let engine,toys,used,merges,wave,win,queue,spark,seq,contactCount,acc=0;
const DT=1000/60, WAVE=86, clamp=(x,lo,hi)=>Math.min(hi,Math.max(lo,x));

function makeToy(level,x,y,epoch){
  const art=CHARS[IDS[level]], w=SIZE[level], points=art.v.map(([a,b])=>({x:a*w,y:b*w}));
  const c=Vertices.centre(points);
  const b=Bodies.fromVertices(x+c.x,y+c.y,[points],{friction:.12,frictionAir:.044,restitution:.18,density:.001});
  b.kind=level;b.w=w;b.h=w/art.ar;b.offset=c;b.squeezeScale=1;b.epoch=epoch;b.no=seq++;b.merging=false;
  return b;
}
function restart(){
  engine=Engine.create({positionIterations:10,velocityIterations:8});engine.gravity.y=.64;
  const wall={isStatic:true,friction:.1};
  Composite.add(engine.world,[
    Bodies.rectangle(-30,H/2,60,H+220,wall),Bodies.rectangle(W+30,H/2,60,H+220,wall),
    Bodies.rectangle(W/2,H+30,W+160,60,wall),Bodies.rectangle(W/2,-42,W+160,60,wall)
  ]);
  toys=[];used=0;merges=0;wave=-1;win=false;queue=[];spark=[];seq=0;contactCount=0;acc=0;
  PACK.forEach((row,r)=>{
    const width=row.reduce((a,k)=>a+SIZE[k],0),gap=(W-width)/(row.length+1);let x=gap;
    row.forEach((k,j)=>{
      const b=makeToy(k,x+SIZE[k]/2,28+r*52+((j*3+r*2)%5-2)*1.2,0);
      Composite.add(engine.world,b);toys.push(b);x+=SIZE[k]+gap;
    });
  });
  const contact=ev=>{
    if(wave<7||wave>=WAVE)return;
    for(const {bodyA,bodyB} of ev.pairs){
      const a=bodyA.parent,b=bodyB.parent;
      if(a.kind===undefined||a.kind!==b.kind||a.epoch===used||b.epoch===used||a.merging||b.merging||a.kind>=IDS.length-1)continue;
      a.merging=b.merging=true;contactCount++;queue.push([a,b]);
    }
  };
  Events.on(engine,'collisionStart',contact);Events.on(engine,'collisionActive',contact);
  sync('试试捏一下，看整堆怎么动。');
}
function sync(message){
  REM.textContent=win?'合成完成！':'剩余 '+toys.length+' 只';
  PRES.textContent='捏了 '+used+' 次';
  BTN.disabled=win||wave>=0;
  BTN.textContent=win?'完成！':wave>=0?'合成中…':'捏一下';
  if(message!==undefined)HINT.textContent=message;
}
function squeeze(){
  if(win||wave>=0)return;
  used++;wave=0;sync('挤一挤，看同款相碰。');
  for(const b of toys){
    const side=b.position.x<W/2?1:-1;
    Body.setVelocity(b,{x:side*(2.9+(b.no%5)*.48),y:-2.8-(b.no%4)*.52});
    Body.setAngularVelocity(b,side*(.08+(b.no%3)*.025));
  }
}
function pairs(){
  const candidates=[];
  for(let i=0;i<toys.length;i++){
    const a=toys[i];if(a.epoch===used||a.kind===IDS.length-1)continue;
    for(let j=i+1;j<toys.length;j++){
      const b=toys[j];if(a.kind!==b.kind||b.epoch===used)continue;
      candidates.push([a,b,Math.hypot(a.position.x-b.position.x,a.position.y-b.position.y)/a.w]);
    }
  }
  candidates.sort((a,b)=>a[2]-b[2]||a[0].no-b[0].no||a[1].no-b[1].no);
  const usedBody=new Set(), out=[];
  for(const [a,b] of candidates)if(!usedBody.has(a)&&!usedBody.has(b)){
    usedBody.add(a);usedBody.add(b);out.push([a,b]);
  }
  return out;
}
function tick(){
  if(wave<0||win)return;
  const breath=wave<12?1-.30*Math.sin(wave/12*Math.PI/2):.70+.30*clamp((wave-12)/55,0,1);
  for(const b of toys){
    const now=b.epoch===used?1:breath;
    if(Math.abs(now-b.squeezeScale)>.001){Body.scale(b,now/b.squeezeScale,now/b.squeezeScale);b.squeezeScale=now}
    const a=Math.atan2(Math.sin(b.angle),Math.cos(b.angle));
    Body.setAngularVelocity(b,b.angularVelocity*.88-a*.026);
  }
  // Attraction affects velocities only. Creation/removal is exclusively through Matter contact pairs.
  if(wave>=7&&wave<65)for(const [a,b] of pairs()){
    const dx=b.position.x-a.position.x,dy=b.position.y-a.position.y,d=Math.max(1,Math.hypot(dx,dy));
    const ax=dx/d,ay=dy/d,k=wave>=29?2.2:1.35;
    for(const [p,s] of [[a,1],[b,-1]])Body.setVelocity(p,{
      x:clamp(p.velocity.x*.77+ax*k*s,-9,9),
      y:clamp(p.velocity.y*.64+ay*k*s-(wave<51?.66:0),-9,9)
    });
  }
  Engine.update(engine,DT);
  if(queue.length){
    for(const [a,b] of queue){
      const n=a.kind+1,r=SIZE[n]/2;
      const x=clamp((a.position.x+b.position.x)/2,r,W-r);
      const y=clamp((a.position.y+b.position.y)/2,SIZE[n]/4,H-SIZE[n]/3);
      Composite.remove(engine.world,[a,b]);
      toys=toys.filter(p=>p!==a&&p!==b);
      const merged=makeToy(n,x,y,used);
      Body.setVelocity(merged,{x:clamp((a.velocity.x+b.velocity.x)/2,-4,4),y:-2.7});
      toys.push(merged);Composite.add(engine.world,merged);merges++;
      spark.push({x,y,age:0,n});
    }
    queue.length=0;
    if(toys.length===1&&toys[0].kind===IDS.length-1){
      win=true;sync('满仓合成一只企鹅！你用了 '+used+' 次。');
    }else sync();
  }
  if(++wave>=WAVE&&!win){wave=-1;sync('继续捏，把剩下的同款合起来。')}
}
function draw(){
  const d=Math.min(2,devicePixelRatio||1),r=CV.getBoundingClientRect();
  const bw=Math.round(r.width*d),bh=Math.round(r.height*d);
  if(CV.width!==bw||CV.height!==bh){CV.width=bw;CV.height=bh}
  const sx=bw/W,sy=bh/H;CTX.setTransform(sx,0,0,sy,0,0);
  const g=CTX.createLinearGradient(0,0,0,H);g.addColorStop(0,'#fff8fd');g.addColorStop(.80,'#ffe7f4');g.addColorStop(1,'#e8b4d3');
  CTX.fillStyle=g;CTX.fillRect(0,0,W,H);
  CTX.fillStyle='#bf83ad2e';CTX.fillRect(0,H-13,W,13);
  CTX.save();CTX.beginPath();CTX.rect(0,0,W,H);CTX.clip();
  for(const b of toys){
    const img=IMG[b.kind];if(!img.complete||!img.naturalWidth)continue;
    CTX.save();CTX.translate(b.position.x,b.position.y);CTX.rotate(b.angle);
    const k=b.squeezeScale;CTX.translate(-b.offset.x*k,-b.offset.y*k);
    CTX.scale(k,k);CTX.shadowColor='#67395855';CTX.shadowBlur=3;CTX.shadowOffsetY=3;
    CTX.drawImage(img,-b.w/2,-b.h/2,b.w,b.h);CTX.restore();
  }
  for(const s of spark){
    if(s.age>38)continue;
    const alpha=1-s.age/38;CTX.globalAlpha=alpha;
    CTX.strokeStyle='#ed67a3';CTX.lineWidth=2+2*alpha;CTX.beginPath();
    CTX.arc(s.x,s.y,12+(reduced?0:s.age*1.0),0,Math.PI*2);CTX.stroke();
  }
  CTX.globalAlpha=1;CTX.restore();
  if(wave>=0&&wave<20&&!reduced){
    const k=Math.sin(wave/20*Math.PI),w=8+11*k;
    CTX.fillStyle='#ef84ae';CTX.fillRect(0,0,w,H);CTX.fillRect(W-w,0,w,H);
  }
  if(win){
    CTX.fillStyle='#fff5fbe8';CTX.fillRect(0,18,W,52);
    CTX.textAlign='center';CTX.font='bold 23px system-ui';CTX.fillStyle='#6f274e';
    CTX.fillText('合成完成！',W/2,52);
  }
}
let last=performance.now();
function frame(t){
  acc+=Math.min(50,t-last);last=t;
  while(acc>=DT){tick();for(const s of spark)s.age++;spark=spark.filter(s=>s.age<=38);acc-=DT}
  draw();requestAnimationFrame(frame);
}
BTN.addEventListener('click',squeeze);RESET.addEventListener('click',restart);
restart();
if(new URLSearchParams(location.search).has('test'))window.__fullSqueeze={
  advance(){while(wave>=0&&wave<WAVE&&!win)tick()},
  snapshot(){return {state:win?'win':wave>=0?'moving':'idle',count:toys.length,used,merges,contactCount,
    mass:toys.reduce((n,b)=>n+(1<<b.kind),0),kinds:toys.map(b=>b.kind),
    frame:toys.map(b=>[b.no,b.kind,b.position.x,b.position.y,b.bounds.min,b.bounds.max])}}
};
requestAnimationFrame(frame);
</script>
</body>
</html>
