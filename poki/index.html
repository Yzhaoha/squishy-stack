<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
<title>Squishy Stack</title>
<style>
:root{--ink:#3b2a4a;--pink:#ff7aa8;--cream:#fff7ee;--mint:#6fd3b5;--gold:#ffc83d;--card:#fffdfb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#bfe6ff;font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
[hidden]{display:none!important}
.layer{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.panel{background:var(--card);border-radius:28px;padding:22px 22px 18px;width:min(420px,100%);max-height:100%;overflow:auto;text-align:center;box-shadow:0 10px 0 #0002,0 20px 50px #0003;border:4px solid #fff}
h1{white-space:nowrap;font-size:clamp(22px,8.5vw,42px);line-height:1;margin:4px 0 2px;color:var(--pink);letter-spacing:1px;text-shadow:0 3px 0 #c94a7c33;font-weight:900}
h2{margin:2px 0 10px;font-size:26px;font-weight:900}
.sub{margin:4px 0 12px;font-weight:700;opacity:.75;font-size:15px}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:14px 16px;margin:10px 0 0;font-weight:900;font-size:22px;font-family:inherit;color:#fff;background:var(--pink);box-shadow:0 6px 0 #c94a7c;cursor:pointer;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c94a7c}
.btn.sec{background:#8b7bd8;box-shadow:0 6px 0 #5f50ad;font-size:18px;padding:11px}
.btn.gold{background:#ffb627;box-shadow:0 6px 0 #c98400}
.btn[disabled]{filter:grayscale(1);opacity:.55;cursor:default}
.row{display:flex;gap:10px}.row .btn{flex:1}
.stat{display:flex;justify-content:space-around;margin:6px 0 4px;font-weight:900}
.stat b{display:block;font-size:34px;color:var(--pink)}
.stat span{font-size:13px;opacity:.7}
.coins{font-weight:900;font-size:18px}
.coins i{font-style:normal;display:inline-block;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6b0,#ffc83d 55%,#d99000);vertical-align:-3px;margin-right:4px;box-shadow:0 1px 0 #a66d00}
.cards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.card{flex:1 1 30%;min-width:110px;max-width:150px;background:#fff;border-radius:20px;padding:12px 8px;border:4px solid var(--c,#ddd);box-shadow:0 6px 0 var(--c,#ddd);cursor:pointer;transition:transform .1s}
.card:hover{transform:translateY(-4px)}
.card .ic{font-size:34px;line-height:1.1}
.card .nm{font-weight:900;font-size:16px;margin:6px 0 4px;overflow-wrap:anywhere;hyphens:auto}
.card .ds{font-size:12.5px;font-weight:700;opacity:.75;line-height:1.25}
.card .k{display:inline-block;margin-top:6px;font-size:11px;font-weight:900;background:#0001;border-radius:6px;padding:1px 6px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.cell{aspect-ratio:1;border-radius:14px;background:#f3eef7;display:flex;align-items:center;justify-content:center;position:relative}
.cell canvas{position:static;width:100%;height:100%}
.cell.r1{background:#e6f0ff}.cell.r2{background:#fff3cf}
.cell.lock canvas{filter:brightness(0) opacity(.18)}
.legend{font-size:12px;font-weight:800;opacity:.7}
#box{width:180px;height:180px;margin:0 auto;position:relative}
#box canvas{position:static;width:180px;height:180px}
.lang{position:fixed;top:10px;right:10px;z-index:6;border:0;border-radius:12px;padding:6px 8px;font-weight:800;font-size:14px;font-family:inherit;background:#fffc;color:var(--ink)}
.icon-btn{position:fixed;z-index:4;border:0;border-radius:50%;width:44px;height:44px;background:#fffc;font-size:20px;cursor:pointer;box-shadow:0 3px 0 #0002}
#mute{top:10px;left:10px}
#pauseB{top:62px;left:10px;font-size:18px}
#adBlock{position:fixed;inset:0;z-index:30;background:transparent}
.skill{position:fixed;z-index:4;bottom:18px;border:0;border-radius:22px;padding:10px 14px;font-weight:900;font-size:15px;font-family:inherit;background:#fff;color:var(--ink);box-shadow:0 5px 0 #0002;cursor:pointer;min-width:86px}
.skill small{display:block;font-size:11px;opacity:.6}
#skWave{left:14px}#skBlink{right:14px}
.skill .n{color:var(--pink)}
.btn{position:relative}
.dot{position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;background:#ff3b6b;border:3px solid #fff}
.btn.mini{font-size:16px;padding:9px}
.btn.ad{background:#3fbf88;box-shadow:0 6px 0 #2a8a60;font-size:18px}
.tabs{display:flex;gap:6px;margin:0 0 8px;flex-wrap:wrap}
.tab{flex:1;border:0;border-radius:12px;padding:8px 4px;hyphens:auto;overflow-wrap:anywhere;font-weight:900;font-family:inherit;font-size:13px;background:#f1ecf6;color:var(--ink);cursor:pointer;min-width:70px}
.tab.on{background:var(--pink);color:#fff}.tab.lock{opacity:.5}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:6px 0}
.day{border-radius:12px;background:#f3eef7;padding:6px 2px;font-size:11px;font-weight:900}
.day b{display:block;font-size:14px;margin-top:2px}.day.got{background:#d9f5e8;opacity:.7}.day.now{outline:3px solid var(--pink);background:#fff}
.mis{display:flex;align-items:center;gap:10px;background:#f6f2fa;border-radius:16px;padding:10px;margin:8px 0;text-align:left}
.mis .t{flex:1;font-weight:800;font-size:14px}.mis .rw{font-size:12px;opacity:.7}
.bar{height:8px;border-radius:4px;background:#e5dcef;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--mint)}
.mis button{border:0;border-radius:12px;padding:9px 12px;font-weight:900;font-family:inherit;background:#ffb627;color:#fff;cursor:pointer;font-size:14px}
.mis button[disabled]{background:#cfc6d8}
.cell .st{position:absolute;bottom:1px;left:0;right:0;font-size:10px;color:#ffb627;font-weight:900;text-shadow:0 1px 0 #fff}
.cell .sh{position:absolute;top:1px;right:3px;font-size:12px}
.cell .q{font-weight:900;font-size:22px;color:#c9bcd8;position:absolute}
.cell.r2:not(.lock){background:linear-gradient(135deg,#fff3cf,#ffe0f0,#dff3ff)}
#boxNext{font-size:13px;font-weight:800;opacity:.7;min-height:18px;margin:6px 0 0}
#tip{position:fixed;left:50%;top:30%;transform:translateX(-50%);z-index:4;max-width:min(360px,88vw);background:#fff;color:var(--ink);font-weight:900;font-size:18px;line-height:1.3;
 padding:12px 16px;border-radius:18px;box-shadow:0 6px 0 #0002,0 10px 30px #0002;text-align:center;pointer-events:none;border:3px solid var(--pink);animation:tipIn .35s ease-out,tipBob 1.6s ease-in-out .35s infinite}
#tip.up::before{content:"";position:absolute;left:50%;top:-13px;margin-left:-10px;border:10px solid transparent;border-top:0;border-bottom:12px solid var(--pink)}
@keyframes tipIn{from{opacity:0;transform:translate(-50%,10px) scale(.9)}}
@keyframes tipBob{50%{margin-top:-6px}}
.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05);filter:brightness(1.1)}}
.hintline{font-weight:900;color:var(--pink);margin:2px 0 8px}
.rankline{display:inline-block;margin:0 0 4px;padding:5px 12px;border-radius:999px;background:#fff3c4;color:#8a5a00;font-weight:900;font-size:14px;cursor:pointer;border:0;font-family:inherit}
.lblist{max-height:min(52vh,430px);overflow:auto;text-align:left;margin:4px 0}
.lbr{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:14px;margin:4px 0;background:#f6f2fa;font-weight:900;font-size:15px}
.lbr .rk{width:30px;text-align:center;color:#8b7bd8;font-size:15px}.lbr canvas{width:40px;height:40px;position:static;flex:none}
.lbr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lbr .sc{color:var(--pink)}
.lbr.me{background:#ffe3ef;outline:3px solid var(--pink)}.lbr.self{background:#eef6ff}
@media (hover:none){.kbd{display:none}}
#bPlay small,.btn small{display:block;font-size:13px;opacity:.9;font-weight:800}
.icons{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.ib{border:0;border-radius:14px;background:#f1ecf6;padding:6px 2px 5px;font-family:inherit;font-weight:900;font-size:11px;color:var(--ink);position:relative;cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib b{display:block;font-size:22px;line-height:1.2}.ib .dot{top:-3px;right:-3px;width:14px;height:14px}
.acts{display:grid;grid-template-columns:repeat(6,1fr);gap:0 10px}.acts .btn{grid-column:span 6}.acts .btn.h{grid-column:span 3}
.flexp{display:flex;flex-direction:column}.flexp .scroll{flex:1 1 auto;min-height:0;overflow:auto}
.goal{font-size:24px;font-weight:900;color:var(--pink);margin:2px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:2px 0 6px}
.chip{background:#eef3ff;color:#4b5ea8;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:900}
.chip.st{background:#fff3c4;color:#8a5a00}.chip.st.got{background:#ffe08a}
.boosts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 2px}
.bt{border:3px solid transparent;border-radius:16px;background:#f6f2fa;padding:6px 2px;font-family:inherit;font-weight:900;font-size:12px;color:var(--ink);cursor:pointer;position:relative}
.bt b{display:block;font-size:24px}.bt.sel{border-color:var(--pink);background:#ffe3ef}.bt i{font-style:normal;color:#b47a00}
.bt em{position:absolute;top:-6px;right:-4px;background:var(--pink);color:#fff;border-radius:999px;font-style:normal;font-size:11px;padding:1px 6px}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:8px 0;padding:4px}
.lvb{aspect-ratio:1;border:0;border-radius:16px;background:#ffe3ef;font-weight:900;font-size:20px;color:var(--ink);font-family:inherit;box-shadow:0 4px 0 #e9b9cc;cursor:pointer;position:relative;padding:0;line-height:1.1}
.lvb small{display:block;font-size:11px;color:#ffb627;letter-spacing:-1px}.lvb.boss{background:#fff3c4;box-shadow:0 4px 0 #e6cf80}
.lvb.lock{background:#eee8f2;box-shadow:0 4px 0 #d8d0e0;color:#b9add0;cursor:default}.lvb.cur{outline:3px solid var(--pink);animation:pulse 1s ease-in-out infinite}
.stars3{font-size:46px;letter-spacing:6px;line-height:1.1;margin:2px 0}
.stars3 span{display:inline-block;color:#e5dcef}.stars3 span.on{color:#ffc83d;animation:starPop .45s both;text-shadow:0 3px 0 #d99000}
@keyframes starPop{0%{transform:scale(.2) rotate(-40deg)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.rew{font-weight:900;font-size:14px;color:#8a5a00;margin:2px 0}
.shr{display:flex;align-items:center;gap:10px;background:#f6f2fa;border-radius:16px;padding:8px 10px;margin:6px 0;text-align:left}
.shr .ic{font-size:30px}.shr .t{flex:1;font-weight:900;font-size:14px;min-width:0}.shr .t small{display:block;font-weight:700;opacity:.7;font-size:12px}
.shr button,.sk button{border:0;border-radius:12px;padding:8px 10px;font-weight:900;font-family:inherit;background:#ffb627;color:#fff;cursor:pointer;font-size:13px;white-space:nowrap}
.shr button[disabled],.sk button[disabled]{background:#cfc6d8;cursor:default}
.skgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:6px 0}
.sk{background:#f6f2fa;border-radius:16px;padding:6px;font-weight:900;font-size:13px}.sk canvas{position:static;width:100%;height:auto;display:block}
.sk.on{outline:3px solid var(--pink);background:#ffe3ef}.sk{min-width:0}.sk button{white-space:normal;font-size:12px;width:100%;margin-top:3px}
#stBack{grid-column:span 2}#stGo{grid-column:span 4}.sk button.use{background:#8b7bd8}
@media (max-height:560px){h1{font-size:32px}.panel{padding:14px}.btn{padding:10px;font-size:19px;margin-top:8px}}
@media (max-height:620px) and (min-aspect-ratio:4/3),(max-height:430px){
 .panel{padding:10px 14px 10px;border-radius:22px}h1{font-size:28px}h2{font-size:20px;margin:0 0 6px}
 #title .sub,#hero,.kbd{display:none}.coins{margin:4px 0;font-size:16px}
 .btn{padding:8px 10px;font-size:17px;margin-top:6px;box-shadow:0 4px 0 #c94a7c}.btn.sec{font-size:15px;padding:7px;box-shadow:0 4px 0 #5f50ad}
 .btn.gold{box-shadow:0 4px 0 #c98400}.btn.ad{box-shadow:0 4px 0 #2a8a60;font-size:15px}
 #bPlay small{display:inline;margin-left:6px}.icons{margin-top:6px}.ib{padding:3px 2px}.ib b{font-size:18px}
 .acts .btn.h2{grid-column:span 3}.acts .btn.h3{grid-column:span 2}
 .stat b{font-size:24px}.stars3{font-size:32px}.goal{font-size:20px}
 #boxL .panel{width:min(600px,100%);display:grid;grid-template-columns:150px 1fr;column-gap:14px;align-items:center}
 #boxL h2,#boxL .tabs{grid-column:1/-1}#boxL #box{grid-column:1;grid-row:3/span 4}#boxL #boxS,#boxL .pair,#boxL #boxNext,#boxL #boxBack{grid-column:2}
 #box,#box canvas{width:140px;height:140px}#boxS{min-height:0!important;margin:2px 0}.pair{display:flex;gap:10px}.pair .btn{flex:1}
 .lvgrid{grid-template-columns:repeat(10,1fr);gap:6px}.lvb{font-size:15px;border-radius:12px}
 .grid{grid-template-columns:repeat(8,1fr)}#collInfo{min-height:0!important}.skgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
 .flexp{width:min(620px,100%)!important}.days{gap:3px}.day{padding:3px 1px}.mis{padding:6px;margin:4px 0}
 .boosts{gap:6px}.bt{padding:3px 2px}.bt b{font-size:18px}.lblist{max-height:none}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="mute" class="icon-btn" aria-label="sound">🔊</button>
<button id="pauseB" class="icon-btn" aria-label="pause" hidden>⏸</button>
<select id="lang" class="lang" aria-label="language"></select>
<div id="tip" hidden></div>
<button id="skWave" class="skill" hidden></button>
<button id="skBlink" class="skill" hidden></button>

<div id="title" class="layer">
  <div class="panel">
    <h1 data-t="name"></h1>
    <p class="sub" data-t="tag"></p>
    <canvas id="hero" width="360" height="190" style="position:static;width:100%;max-width:300px;height:auto"></canvas>
    <p class="coins"><i></i><span id="tCoins">0</span> · <span data-t="best"></span> <b id="tBest">0</b></p>
    <button class="rankline" id="tRank"></button>
    <button id="bPlay" class="btn"><span data-t="play"></span><small id="bPlayLv"></small></button>
    <div class="row"><button id="bMap" class="btn sec mini">🗺️ <span data-t="map"></span></button><button id="bEndless" class="btn sec mini"></button></div>
    <div class="icons">
     <button class="ib" id="bShop"><b>🎁</b><span data-t="i_box"></span><em class="dot" id="dBox" hidden></em></button>
     <button class="ib" id="bColl"><b>🎨</b><span data-t="i_coll"></span></button>
     <button class="ib" id="bStore"><b>🛒</b><span data-t="i_shop"></span></button>
     <button class="ib" id="bDaily"><b>📅</b><span data-t="i_daily"></span><em class="dot" id="dDaily" hidden></em></button>
     <button class="ib" id="bMiss"><b>✅</b><span data-t="i_miss"></span><em class="dot" id="dMiss" hidden></em></button>
    </div>
    <p class="sub kbd" style="margin:12px 0 0;font-size:13px" data-t="how"></p>
  </div>
</div>

<div id="pick" class="layer" hidden>
  <div class="panel" style="width:min(520px,100%)">
    <h2 id="pickT"></h2>
    <p class="hintline" id="pickHint" hidden></p>
    <div class="cards" id="cards"></div>
  </div>
</div>

<div id="over" class="layer" hidden>
  <div class="panel">
    <h2 id="overT"></h2>
    <p class="hintline" id="overHint" hidden></p>
    <div class="stat"><div><b id="oFloor">0</b><span data-t="floors"></span></div><div><b id="oBest">0</b><span data-t="best"></span></div><div><b id="oCoin">0</b><span data-t="earned"></span></div></div>
    <p class="sub" id="oNear" style="color:#ff5ca0;margin:2px 0"></p>
    <button class="rankline" id="oRank"></button>
    <p class="coins"><i></i><span id="oTotal">0</span></p>
    <div class="acts">
    <button id="oDouble" class="btn ad h2"></button>
    <button id="oAgain" class="btn h2" data-t="again"></button>
    <button id="oBox" class="btn gold h3"></button>
    <button id="oColl" class="btn sec h h3" data-t="coll"></button><button id="oHome" class="btn sec h h3" data-t="home"></button>
    </div>
  </div>
</div>

<div id="boxL" class="layer" hidden>
  <div class="panel">
    <h2 id="boxT"></h2>
    <div class="tabs" id="boxTabs"></div>
    <div id="box"><canvas id="boxCv" width="360" height="360"></canvas></div>
    <p class="sub" id="boxS" style="min-height:42px"></p>
    <div class="pair"><button id="boxGo" class="btn gold"></button>
    <button id="boxAd" class="btn ad"></button></div>
    <p id="boxNext"></p>
    <button id="boxBack" class="btn sec" data-t="back"></button>
  </div>
</div>

<div id="collL" class="layer" hidden>
  <div class="panel flexp" style="width:min(460px,100%)">
    <h2 data-t="coll"></h2>
    <div class="tabs" id="collTabs"></div>
    <p class="legend" id="collN"></p>
    <div class="scroll"><div class="grid" id="grid"></div></div>
    <p class="legend" id="setReward"></p>
    <div class="tabs" id="skins"></div>
    <p class="sub" id="collInfo" style="min-height:40px;font-size:14px"></p>
    <button id="collBack" class="btn sec" data-t="back"></button>
  </div>
</div>

<div id="dailyL" class="layer" hidden><div class="panel" style="width:min(460px,100%)">
  <h2 data-t="daily"></h2><p class="sub" id="dailyS"></p><div class="days" id="days"></div>
  <button id="dailyGo" class="btn gold"></button><button id="dailyBack" class="btn sec" data-t="back"></button></div></div>
<div id="missL" class="layer" hidden><div class="panel flexp">
  <h2 data-t="missions"></h2><p class="sub" data-t="missSub"></p><div id="missList" class="scroll"></div>
  <button id="missBack" class="btn sec" data-t="back"></button></div></div>
<div id="revL" class="layer" hidden><div class="panel">
  <h2 data-t="revT"></h2><p class="sub" id="revS"></p>
  <button id="revGo" class="btn ad"></button><button id="revNo" class="btn sec"></button></div></div>
<div id="lbL" class="layer" hidden><div class="panel flexp" style="width:min(420px,100%)">
  <h2 data-t="lb"></h2><div class="tabs" id="lbTabs"></div><p class="legend" data-t="lbReset"></p><div id="lbList" class="lblist scroll"></div>
  <button id="lbBack" class="btn sec" data-t="back"></button></div></div>
<div id="startL" class="layer" hidden><div class="panel">
  <p class="legend" id="stChap" style="margin:0"></p><h2 id="stT"></h2>
  <p class="goal" id="stGoal"></p><div class="chips" id="stRules"></div><div class="chips" id="stStars"></div>
  <p class="legend" data-t="boost" style="margin:4px 0 0"></p><div class="boosts" id="stBoost"></div>
  <div class="acts"><button id="stBack" class="btn sec" data-t="back"></button><button id="stGo" class="btn" data-t="go"></button></div></div></div>
<div id="lvEnd" class="layer" hidden><div class="panel">
  <h2 id="leT"></h2><div class="stars3" id="leStars"></div><p class="hintline" id="leHint" hidden></p>
  <p class="sub" id="leSub" style="margin:2px 0"></p><div class="rew" id="leRew"></div><p class="coins"><i></i><span id="leTotal">0</span></p>
  <div class="acts"><button id="leDouble" class="btn ad h2"></button><button id="leNext" class="btn h2"></button>
  <button id="leBox" class="btn gold h3"></button><button id="leMap" class="btn sec h h3" data-t="map"></button><button id="leHome" class="btn sec h h3" data-t="home"></button></div></div></div>
<div id="mapL" class="layer" hidden><div class="panel flexp" style="width:min(460px,100%)">
  <h2 data-t="map"></h2><div class="tabs" id="mapTabs"></div><p class="legend" id="mapStars"></p><div class="scroll"><div class="lvgrid" id="lvGrid"></div></div>
  <button id="mapBack" class="btn sec" data-t="back"></button></div></div>
<div id="shopL" class="layer" hidden><div class="panel flexp" style="width:min(460px,100%)">
  <h2 data-t="shop"></h2><p class="coins" style="margin:0 0 6px"><i></i><span id="shCoins">0</span></p><div class="tabs" id="shTabs"></div><div id="shList" class="scroll"></div>

function swingPeriod(){return Math.max(0.68,2.25-G.floor*0.018)*(1+0.12*lv('slow'))*(!tutDone&&G.floor<5?1.45:1)/(G.lvl&&G.lvl.fast||1)}

function drop(){
 if(userPaused||adActive||G.state!=='play'||!G.hook.piece||G.hook.cool>0||G.falling)return;
 const p=G.hook.piece,h=hookPos();
 p.x=h.x;p.y=pivotY()-ROPE-p.h;p.vx=h.vx*0.35;p.vy=-60;
 if(G.blinkArm){G.blinkArm=false;p.x=topLocalX()+swayAt(topY());p.vx=0;p.blinked=true;burst(p.x,p.y+p.h/2,'#b9a8ff',14);SFX.blink()}
 G.falling=p;G.hook.piece=null;G.hook.cool=0.28;G.drops++;SFX.drop();
}

function land(p){
 const ty=topY(),tp=topPiece();
 const topX=(tp?tp.lx:240)+swayAt(ty);
 let dx=p.x-topX;
 const tw=tp?tp.w:BASE.w;
 const s=p.s;
 if(lv('mag'))dx*=1-0.2*lv('mag');
 let catchK=0.82*(1+0.1*lv('sticky'))*(s.trait==='sticky'?1.15:1)*Math.max(0.55,1-Math.max(0,G.floor-90)/250);
 const lim=(tw+p.w)/2*Math.min(catchK,1.05);
 if(Math.abs(dx)>lim){ // miss
  p.vx=(dx>0?1:-1)*160;p.vr=(dx>0?1:-1)*4;p.missed=true;G.lost.push(p);
  G.hearts--;G.lostHearts++;G.combo=0;G.shake=8;pop(p.x,ty+40,T('miss'),'#ff5d7a',1.1);SFX.miss();vib(40);if(G.hearts>0)tutOnce('tut5',3);
  if(G.hearts<=0){endRun(false)}else if(dropsLeft()<=0){G.failReason='drops';endRun(false)}
  return;
 }
 let perfectW=7*(1+0.3*lv('wide'))*(s.trait==='fluffy'?1.6:1);
 const perfect=Math.abs(dx)<=perfectW||p.blinked;
 if(perfect)dx=0;
 p.lx=(tp?tp.lx:240)+dx;p.y=ty;p.sq=0;p.sqv=-6.5;p.mood=perfect?1.2:0;
 G.tower.push(p);G.floor++;missAdd(s.ser,1);checkPass();
 // squish everyone below a little
 for(let i=G.tower.length-2,k=0;i>=0&&k<5;i--,k++){G.tower[i].sqv-=3.2/(k+1)}
 // wobble
 let add=Math.abs(dx)*0.26+0.7;
 if(s.trait==='heavy')add*=0.6;
 add*=1-0.15*lv('glue');add*=1+Math.max(0,G.floor-90)/80;
 let gain=1;
 if(perfect){G.combo++;G.perfN++;tutOnce('tut3',2.6);missAdd('perf',1);missMax('combo',G.combo);G.sway*=G.combo>=3?0.55:0.72;add=0.4;
  gain=2*(1+lv('aura'));if(G.combo>=3)gain+=G.combo;
  pop(p.lx,ty+p.h+30,G.combo>=3?T('combo',{n:G.combo}):T('perfect'),'#ff5ca0',G.combo>=3?1.35:1.1);
  SFX.perfect(G.combo);ring(p.lx,ty+p.h/2,p.w)}
 else{G.combo=0}
 G.sway+=add;
 let c=1+gain;if(s.trait==='gold')c*=3;if(s.trait==='bouncy')c+=2;c+=(stars[p.id]||0);if(p.shiny)c+=3;
 G.coinsRun+=c;flyCoin(p.lx,ty+p.h,c);
 SFX.squish(G.combo);vib(perfect?20:12);
 burst(p.lx,ty+4,s.col,perfect?14:7);
 const z=zoneOf(G.floor);if(z!==G.lastZone){G.lastZone=z;G.zoneShow={t:2.2,z}}
 if(G.mode==='level'&&G.floor>=G.lvl.n){winLevel();return}
 if(dropsLeft()<=0){G.failReason='drops';endRun(false);return}
 if(G.floor%10===0)openPick();
}

const RIVALS=[['mochi',5],['frog',9],['dump',13],['shiba',17],['oni',21],['cro',26],['sushi',31],['jelly',36],['ghost',41],['axo',47],['cow',53],['shark',60],['rpanda',67],['capy',75],['toast',83],['donut',92],['cat',102],['peng',113],['boba',125],['bunny',138],['uni',152],['dragon',168],['gcapy',185],['cosmo',205]];
function weekKey(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.toDateString()}
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return((h>>>0)%10000)/10000}
let WK=store.get('wk',{k:'',b:0});function weekBest(){return WK.k===weekKey()?WK.b:0}
function rivalList(all){const wk=weekKey();return RIVALS.map(([id,b])=>({id,score:all?b:Math.max(3,Math.round(b*(0.88+0.24*hash(wk+id))))}))}
function myRank(score,all){return 1+rivalList(all).filter(r=>r.score>score).length}
let runTargets=[],passedN=0,passFx=null;
function buildTargets(){runTargets=rivalList(false).map(r=>({id:r.id,score:r.score,name:'s_'+r.id}));
 const wb=weekBest();if(wb>0)runTargets.push({self:'lbWB',score:wb,id:lastOwned()});if(best>0&&best!==wb)runTargets.push({self:'lbAB',score:best,id:lastOwned()});
 runTargets.sort((a,b)=>a.score-b.score);passedN=0;passFx=null}
function lastOwned(){return owned[owned.length-1]||'capy'}
function nextTarget(){for(const t of runTargets)if(t.score>=G.floor&&!t.passed)return t;return null}
function checkPass(){for(const t of runTargets){if(!t.passed&&G.floor>t.score){t.passed=true;if(t.score<1)continue;if(!t.self)passedN++;
  passFx={t:0,id:t.id,self:t.self};const nm=t.self?T(t.self):T(t.name);pop(topLocalX(),topY()+90,T('lbPass',{n:nm}),t.self?'#3fbf88':'#ffb627',1.15);SFX.pass()}}}
function heightOfFloor(f){if(G.tower.length>=f){let y=BASE.h;for(let i=0;i<f;i++)y+=G.tower[i].h;return y}return topY()+(f-G.tower.length)*68}
function rankText(){const wb=weekBest(),r=myRank(wb,false);return wb<=0?'🏆 '+T('lb')+' ›':(r===1?'🏆 '+T('lbFirst')+' ›':'🏆 '+T('lbRank',{n:r})+' ›')}

 let ids=Object.keys(MDEF).filter(k=>k!=='dream'||seriesOpen('dream'));for(let i=ids.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[ids[i],ids[j]]=[ids[j],ids[i]]}

/* ================= update ================= */
function update(dt){
 G.time+=dt;
 // jiggle springs
 const all=G.tower.concat(G.hook.piece?[G.hook.piece]:[],G.falling?[G.falling]:[]);
 for(const p of all){p.sqv+=(-p.sq*260-p.sqv*9)*dt;p.sq+=p.sqv*dt*0.12;p.blinkT-=dt;if(p.blinkT<0)p.blinkT=2+Math.random()*3;p.mood=Math.max(0,p.mood-dt)}
 if(G.state==='play'||G.state==='pick'){
  if(G.state==='play'){
   G.hook.t+=dt;if(G.hook.cool>0){G.hook.cool-=dt;if(G.hook.cool<=0&&!G.hook.piece&&dropsLeft()>0){G.hook.piece=mkPiece(nextSpecies())}}
   // sway dynamics
   const w=2*Math.PI/(1.6+Math.min(2.2,topY()/900));
   G.phase+=w*dt;
   G.sway=Math.max(0,G.sway-dt*(2.2+0.05*G.sway)*Math.max(0.3,1-G.floor/140)*(1+0.15*lv('glue')));
   if(G.sway>120){endRun(true)}
   if(G.sway>80&&Math.random()<dt*1.5)SFX.wobble();
   if(G.sway>22&&tipT<=0)tutOnce('tut4',3.2,true);
   // wind
   if(G.lvl){if(G.lvl.wind){G.windT-=dt;if(G.windT<=0){G.windT=3.5+Math.random()*3;G.wind=(Math.random()<0.5?-1:1)*G.lvl.wind*(0.7+Math.random()*0.6)}}else G.wind=0}
   else if(zoneOf(G.floor)>=2){G.windT-=dt;if(G.windT<=0){G.windT=6+Math.random()*4;G.wind=(Math.random()<0.5?-1:1)*(30+G.floor*0.9+Math.random()*50)*(Math.random()<0.25?0:1)}}else G.wind=0;
   // falling piece
   const f=G.falling;
   if(f){f.vy-=2600*dt;f.vx+=G.wind*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;
    if(f.y<=topY()){f.y=topY();G.falling=null;land(f)}}
   if(G.auto)autoPlay(dt);
  }
 }
 // lost pieces
 for(const p of G.lost){if(p.delay>0){p.delay-=dt;continue}p.vy=(p.vy||0)-2200*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt}
 G.lost=G.lost.filter(p=>p.y>G.cam-600);
 // topple
 if(G.topple){G.topple.t+=dt}
 // hook centre and camera follow the tower top sideways
 G.hookC+=(topLocalX()-G.hookC)*Math.min(1,dt*2.5);
 G.camX+=((G.state==='title'?0:topLocalX()-240)*0.7-G.camX)*Math.min(1,dt*2);
 // camera
 const target=Math.max(0,topY()-(VH-GROUND)*0.42);
 G.cam+=(target-G.cam)*Math.min(1,dt*3.2);
 G.shake=Math.max(0,G.shake-dt*30);
 for(const q of G.pops)q.t+=dt;G.pops=G.pops.filter(q=>q.t<1.1);
 for(const q of G.parts){q.t+=dt;if(q.kind!=='ring'){q.vy-=900*dt;q.x+=q.vx*dt;q.y+=q.vy*dt}}G.parts=G.parts.filter(q=>q.t<q.life);
 if(G.zoneShow){G.zoneShow.t-=dt;if(G.zoneShow.t<=0)G.zoneShow=null}
}

// test bot: aims well, then taps a bit early/late like a person (?auto=1&sk=0.06)
let botAim=0;
function gauss(){return Math.sqrt(-2*Math.log(Math.random()+1e-9))*Math.cos(2*Math.PI*Math.random())}
function autoPlay(dt){
 if(!G.hook.piece||G.falling)return;
 if(G.sway>75&&G.waves>0)useWave();
 if(G.blinks>0&&G.sway>45&&!G.blinkArm)useBlink();
 const h=hookPos();const tX=topLocalX()+swayAt(topY());
 const dy=pivotY()-ROPE-G.hook.piece.h-topY();const t=Math.sqrt(Math.max(0,2*dy/2600));
 const px=h.x+h.vx*0.35*t;
 if(Math.abs(px-tX)<4){G.hook.t+=gauss()*G.botSkill;drop()}
}
/* ================= render ================= */
const ZC=[['#bfe9ff','#e9fbff'],['#9fd0ff','#ffe9f2'],['#c6d9ff','#f5f0ff'],['#ff9e9e','#ffd59a'],['#1b1640','#3d2d7a']];
function lerpC(a,b,t){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);const r=((pa>>16)+(((pb>>16)-(pa>>16))*t))|0,g=(((pa>>8)&255)+((((pb>>8)&255)-((pa>>8)&255))*t))|0,bl=((pa&255)+(((pb&255)-(pa&255))*t))|0;return`rgb(${r},${g},${bl})`}
function skyAt(y){const f=y/66;const zs=[0,12,25,40,60];let i=0;while(i<4&&f>zs[i+1])i++;const t=i<4?Math.min(1,Math.max(0,(f-zs[i])/(zs[i+1]-zs[i]))):0;const j=Math.min(4,i+1);return[lerpC(ZC[i][0],ZC[j][0],t*t),lerpC(ZC[i][1],ZC[j][1],t*t)]}
function wx(x){return OX+(x-G.camX)*S}
function wy(y){return CH-(GROUND*S)-(y-G.cam)*S}
const clouds=[];for(let i=0;i<26;i++)clouds.push({x:Math.random()*1.6-0.3,y:600+Math.random()*5200,s:0.6+Math.random()*1.2,p:0.3+Math.random()*0.5});
const bgStars=[];for(let i=0;i<160;i++)bgStars.push({x:Math.random(),y:2600+Math.random()*9000,r:Math.random()*1.8+0.4,p:0.2+Math.random()*0.3});

function render(){
 const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);
 const midY=G.cam+VH*0.5;const [top,bot]=skyAt(midY+VH*0.3),[,bot2]=skyAt(midY-VH*0.3);
 const gr=c.createLinearGradient(0,0,0,CH);gr.addColorStop(0,top);gr.addColorStop(1,bot2||bot);c.fillStyle=gr;c.fillRect(0,0,CW,CH);
 const sh=G.shake?(Math.random()-0.5)*G.shake:0;
 c.save();c.translate(sh,0);

 $('dDaily').hidden=!dailyReady();$('dMiss').hidden=!missReady()}
function updSkills(){const on=G.state==='play'||G.state==='pick';$('pauseB').hidden=!(G.state==='play'&&!userPaused);
 const w=$('skWave'),b=$('skBlink');w.hidden=!(on&&G.waves>0);b.hidden=!(on&&(G.blinks>0||G.blinkArm));
 w.innerHTML=`💥 ${T('wave')} <span class="n">${G.waves}</span><small>S</small>`;b.innerHTML=`✨ ${T('blink')} <span class="n">${G.blinks}</span><small>D</small>`;b.style.outline=G.blinkArm?'4px solid #8b7bd8':''}
const ls=$('lang');LANGS.forEach(([k,n])=>{const o=document.createElement('option');o.value=k;o.textContent=n;ls.appendChild(o)});ls.value=LANG;
ls.onchange=()=>{LANG=ls.value;store.set('lang',LANG);applyText()};
$('mute').onclick=e=>{e.stopPropagation();muted=!muted;store.set('mute',muted);$('mute').textContent=muted?'🔇':'🔊'};$('mute').textContent=muted?'🔇':'🔊';
$('bPlay').onclick=()=>{const cl=curLevel();if(LP[cl])openMap();else openStart('level',cl)};
$('bMap').onclick=()=>openMap();$('bEndless').onclick=()=>{if(endlessOpen())openStart('endless')};$('bStore').onclick=()=>openShop('title');
$('oHome').onclick=goTitle;
$('bColl').onclick=()=>openColl('title');$('oColl').onclick=()=>openColl('over');
$('bShop').onclick=()=>openBox('title');$('oBox').onclick=()=>{$('oBox').classList.remove('pulse');openBox('over')};
$('skWave').onclick=e=>{e.stopPropagation();useWave()};$('skBlink').onclick=e=>{e.stopPropagation();useBlink()};
function goTitle(){gp(false);BASE.w=200;G.mode='endless';G.lvl=null;G.wind=0;G.state='title';G.tower=[];G.lost=[];G.falling=null;G.topple=null;G.cam=0;showLayer('title');applyText()}

cv.addEventListener('pointerdown',e=>{if(G.state==='play'){drop()}});
function pauseGame(){if(G.state!=='play'||userPaused||adActive)return;userPaused=true;gp(false);try{AC&&AC.suspend()}catch(e){}$('pauseL').hidden=false;updSkills()}
function resumeGame(){if(!userPaused||adActive)return;$('pauseL').hidden=true;adBreak(()=>{userPaused=false;last=performance.now();if(!adMute)try{AC&&AC.resume()}catch(e){}if(G.state==='play')gp(true);updSkills()})}
$('pauseB').onclick=e=>{e.stopPropagation();pauseGame()};$('pzGo').onclick=resumeGame;
$('pzHome').onclick=()=>{if(adActive)return;userPaused=false;$('pauseL').hidden=true;goTitle()};
addEventListener('keydown',e=>{
 const k=e.code;
 if(adActive){if(k==='Space'||k.startsWith('Arrow'))e.preventDefault();return}
 if(userPaused){if(k==='Escape'||k==='KeyP'||k==='Space'||k==='Enter'){e.preventDefault();resumeGame()}return}
 if(G.state==='play'&&(k==='Escape'||k==='KeyP')){e.preventDefault();pauseGame();return}
 if(G.state==='play'){if(k==='Space'||k==='Enter'||k==='ArrowDown'){e.preventDefault();drop()}if(k==='KeyS')useWave();if(k==='KeyD')useBlink()}
 else if(G.state==='pick'){if(k==='Digit1'||k==='Numpad1')choose(0);if(k==='Digit2'||k==='Numpad2')choose(1);if(k==='Digit3'||k==='Numpad3')choose(2)}
 else if((k==='Space'||k==='Enter')&&!$('title').hidden){e.preventDefault();$('bPlay').click()}
 else if((k==='Space'||k==='Enter')&&!$('startL').hidden){e.preventDefault();goStart()}
 else if((k==='Space'||k==='Enter')&&!$('lvEnd').hidden){e.preventDefault();$('leNext').click()}
 else if((k==='Space'||k==='Enter')&&!$('over').hidden){e.preventDefault();$('oAgain').click()}
 if(k==='KeyM')$('mute').click();
});

/* collection */
function thumb(id,size,locked,shiny){const cvs=document.createElement('canvas');cvs.width=size*2;cvs.height=size*2;const c=cvs.getContext('2d');const s=SP[id];const p={s,w:s.w,h:s.h,sq:0,blinkT:9,shiny:!!shiny&&!locked};
 const ext=['bunny','uni','fin','dragon','bat'].includes(s.ears)?1.7:1.3;const k=size*2/Math.max(s.w*(s.ears==='bat'||s.ears==='dragon'?1.5:1),s.h*ext)*0.8;drawPiece(p,size,size*2*0.86,0,locked?0:1,1,c,k);return cvs}
let collFrom='title',collSer='pals';
function serDone(id){return SPECIES.filter(x=>x.ser===id).every(x=>owned.includes(x.id))}
function openColl(from){if(from)collFrom=from;
 const tabs=$('collTabs');tabs.innerHTML='';SERIES.forEach(x=>{const b=document.createElement('button');const n=SPECIES.filter(y=>y.ser===x.id);const got=n.filter(y=>owned.includes(y.id)).length;
  b.className='tab'+(x.id===collSer?' on':'');b.textContent=`${T('ser_'+x.id)} ${got}/${n.length}`;b.onclick=()=>{collSer=x.id;openColl()};tabs.appendChild(b)});
 const g=$('grid');g.innerHTML='';
 SPECIES.filter(x=>x.ser===collSer).forEach(s=>{const has=owned.includes(s.id);const d=document.createElement('div');d.className='cell r'+s.r+(has?'':' lock');
  if(!has&&s.r===2){const q=document.createElement('span');q.className='q';q.textContent='?';d.appendChild(q)}else d.appendChild(thumb(s.id,48,!has,shinyOwn[s.id]));
  if(has&&stars[s.id]){const st=document.createElement('span');st.className='st';st.textContent='★'.repeat(stars[s.id]);d.appendChild(st)}
  if(shinyOwn[s.id]){const sh=document.createElement('span');sh.className='sh';sh.textContent='✨';d.appendChild(sh)}
  d.onclick=()=>{$('collInfo').innerHTML=has?`<b>${T('s_'+s.id)}</b> · ${T('rar'+s.r)}${stars[s.id]?' · '+'★'.repeat(stars[s.id]):''}${shinyOwn[s.id]?' · ✨':''}<br>${T('t_'+s.trait)}`:T('locked')};g.appendChild(d)});
 $('collN').textContent=T('collN',{a:owned.length,b:SPECIES.length});$('collInfo').textContent='';
 const sk=SER[collSer].skin;$('setReward').textContent=serDone(collSer)?T('setDone',{r:T('sk_'+sk)}):T('setTodo',{r:T('sk_'+sk)});
 showLayer('collL')}
$('collBack').onclick=()=>{showLayer(collFrom);if(collFrom==='title')applyText()};

/* blind box */
let boxFrom='title',boxState='idle',boxT=0,boxRes=null,boxSer='pals',boxShiny=false,adBox=store.get('adBox',{d:'',n:0});
const AD_BOXES=3;
function adBoxLeft(){return adBox.d===today()?AD_BOXES-adBox.n:AD_BOXES}
function openBox(from){boxFrom=from;boxState='idle';boxRes=null;if(!seriesOpen(boxSer))boxSer='pals';showLayer('boxL');$('boxT').textContent=T('boxTitle');refreshBox()}
function fmtT(ms){const t=Math.max(0,Math.ceil(ms/1000));const h=t/3600|0,m=(t%3600)/60|0,s2=t%60;return(h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(s2).padStart(2,'0')}
function refreshBox(){
 const tabs=$('boxTabs');tabs.innerHTML='';SERIES.forEach(x=>{const b=document.createElement('button');const open=seriesOpen(x.id);b.className='tab'+(x.id===boxSer?' on':'')+(open?'':' lock');
  b.textContent=open?T('ser_'+x.id):T('serLock2',{n:20});b.onclick=()=>{if(!open||boxState==='shake')return;boxSer=x.id;boxState='idle';refreshBox()};tabs.appendChild(b)});
 const go=$('boxGo'),free=freeReady();
 if(boxState==='idle')$('boxS').textContent=free||coins>=BOX_COST?T('boxTap'):T('boxNeed',{c:BOX_COST});
 go.textContent=free?T('boxFree'):T('boxCost',{c:BOX_COST})+'  ('+coins+')';go.disabled=(!free&&coins<BOX_COST)||boxState==='shake';
 const ad=$('boxAd'),left=adBoxLeft();ad.textContent=left>0?T('boxAd',{n:left}):T('boxAdNone');ad.disabled=left<=0||boxState==='shake';ad.hidden=free;
 $('boxNext').textContent=!free?T('boxNextIn',{t:fmtT(freeAt-Date.now())}):''}
function roll(ser){if(store.get('firstBox',false)){store.set('firstBox',false);const nw=SPECIES.filter(s=>s.ser===ser&&s.r===0&&!owned.includes(s.id));if(nw.length)return nw[Math.random()*nw.length|0].id}
 const r=Math.random();const rar=r<0.03?2:r<0.28?1:0;const pool=SPECIES.filter(s=>s.ser===ser&&s.r===rar);return pool[Math.random()*pool.length|0].id}
function startBox(){boxState='shake';boxT=0;boxRes=roll(boxSer);boxShiny=Math.random()<0.05;missAdd('box',1);refreshBox();ac()}
function doBox(){if(boxState==='shake')return;
 if(tokens>0){tokens--;store.set('tokens',tokens)}
 else if(Date.now()>=freeAt){freeAt=Date.now()+4*3600*1000;store.set('freeAt',freeAt)}
 else{if(coins<BOX_COST)return;coins-=BOX_COST;store.set('coins',coins)}
 startBox()}
$('boxGo').onclick=doBox;
$('boxAd').onclick=()=>{if(boxState==='shake'||adBoxLeft()<=0)return;Ads.rewarded(ok=>{if(!ok)return;if(adBox.d!==today())adBox={d:today(),n:0};adBox.n++;store.set('adBox',adBox);startBox()})};
$('boxCv').onclick=()=>{if(boxState!=='shake')doBox()};
$('boxBack').onclick=()=>{if(boxState==='shake')return;$('oTotal').textContent=coins;$('leTotal').textContent=coins;updBoxBtn();showLayer(boxFrom);if(boxFrom==='title')applyText()};
setInterval(()=>{if(!$('boxL').hidden&&boxState!=='shake')$('boxNext').textContent=!freeReady()?T('boxNextIn',{t:fmtT(freeAt-Date.now())}):'';if(!$('title').hidden)updBoxBtn()},1000);
function revealBox(){const s=SP[boxRes];const id=boxRes,nm=T('s_'+id);let msg;
 if(!owned.includes(id)){owned.push(id);store.set('owned',owned);msg=`<b>${T('boxNew',{n:nm})}</b> · ${T('rar'+s.r)}<br>${T('t_'+s.trait)}`}
 else if((stars[id]||0)<3){stars[id]=(stars[id]||0)+1;store.set('stars',stars);msg=T('starUp',{n:nm,s:stars[id]})}
 else{const back=[30,45,90][s.r];coins+=back;store.set('coins',coins);msg=T('starMax',{n:nm,c:back})}
 if(boxShiny){shinyOwn[id]=true;store.set('shiny',shinyOwn);msg=`<b>${T('shiny')}</b><br>`+msg}
 $('boxS').innerHTML=msg;SFX.reveal(boxShiny?2:s.r);refreshBox()}
function boxTick(dt){if($('boxL').hidden)return;const c=$('boxCv').getContext('2d');c.clearRect(0,0,360,360);
 if(boxState==='shake'){boxT+=dt;if(Math.floor(boxT*10)!==Math.floor((boxT-dt)*10))SFX.box();if(boxT>1.3){boxState='open';boxT=0;revealBox()}}
 if(boxState==='open'){boxT+=dt;const s=SP[boxRes];
  // rays
  c.save();c.translate(180,190);c.rotate(boxT*0.6);const rc=['#ffe3f0','#d8e6ff','#ffe08a'][s.r];c.fillStyle=rc;for(let i=0;i<12;i++){c.rotate(Math.PI/6);c.beginPath();c.moveTo(0,0);c.lineTo(-22,-200);c.lineTo(22,-200);c.fill()}c.restore();
  const k=Math.min(1,boxT*3);const p={s,w:s.w,h:s.h,sq:Math.sin(boxT*14)*0.25*Math.max(0,1-boxT),blinkT:9,shiny:boxShiny};const sc=(['bunny','uni','fin','dragon','bat'].includes(s.ears)?1.7:2.1)*(0.4+0.6*k)*(1+0.05*Math.sin(boxT*4));drawPiece(p,180,270,0,1,1,c,sc);
  c.font='900 26px Nunito,sans-serif';c.textAlign='center';c.fillStyle=['#ff5ca0','#4b7bff','#d99000'][s.r];c.fillText(T('rar'+s.r)+(boxShiny?' ✨':''),180,340);return}
 // box
 const sh=boxState==='shake'?Math.sin(boxT*50)*(4+boxT*8):0;const bob=boxState==='idle'?Math.sin(performance.now()/300)*4:0;
 c.save();c.translate(180+sh,200+bob);c.rotate(sh*0.01);
 const bc=SER[boxSer].box;c.fillStyle=bc[0];c.strokeStyle=bc[1];c.lineWidth=6;rrc(c,-80,-60,160,130,20);c.fill();c.stroke();
 c.fillStyle=bc[2];rrc(c,-92,-92,184,44,16);c.fill();c.stroke();
 c.fillStyle='#ffc83d';c.fillRect(-14,-92,28,162);
 c.font='900 64px Nunito,sans-serif';c.textAlign='center';c.fillStyle='#fff';c.fillText('?',0,40);
 c.restore()}
function rrc(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

/* title hero */
function heroTick(){if($('title').hidden)return;const c=$('hero').getContext('2d');c.clearRect(0,0,360,190);const ids=owned.slice(-3);while(ids.length<3)ids.unshift(START[ids.length]);
 let y=182;const t=performance.now()/1000;ids.forEach((id,i)=>{const s=SP[id];const sc=0.82;const p={s,w:s.w,h:s.h,sq:Math.sin(t*3+i)*0.08,blinkT:(t+i)%3};const x=180+Math.sin(t*1.6)*6*i;drawPiece(p,x,y,Math.sin(t*1.6)*0.04*i,1,1,c,sc);y-=s.h*sc})}

/* loop */
let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;if(!paused&&!userPaused){update(dt);tutTick(dt)}render();boxTick(dt);heroTick();requestAnimationFrame(frame)}
// title background: a little demo tower
function demo(){['capy','dump','axo','cro','mochi'].forEach((id,i)=>{const p=mkPiece(id);p.lx=240+(i%2?8:-6);p.y=topY();G.tower.push(p)});G.sway=6}
demo();applyText();showLayer('title');requestAnimationFrame(frame);
try{if(window.PokiSDK){PokiSDK.init().catch(()=>{}).then(()=>{try{PokiSDK.gameLoadingFinished()}catch(e){}})}}catch(e){}
if(tutDone&&dailyReady()&&!new URLSearchParams(location.search).get('auto'))setTimeout(()=>{if(!$('title').hidden)openDaily()},700);
// title idle: keep the demo tower swaying
setInterval(()=>{if(G.state==='title'){G.phase+=0.05;G.sway=6}},50);

})();
</script>
